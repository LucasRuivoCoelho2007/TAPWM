<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <div class="container">

        <label>Altura (m)</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">

        <label>Peso (kg)</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 80">

        <button onclick="calcularIMC()">
            Calcular
        </button>

        <div id="resultado"></div>

        <h2>Tabela IMC</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>IMC</th>
                    <th>Classificação</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Menor que 18.5</td>
                    <td>Magreza</td>
                </tr>

                <tr>
                    <td>18.5 até 24.9</td>
                    <td>Normal</td>
                </tr>

                <tr>
                    <td>25.0 até 29.9</td>
                    <td>Sobrepeso</td>
                </tr>

                <tr>
                    <td>30.0 até 39.9</td>
                    <td>Obesidade</td>
                </tr>

                <tr>
                    <td>Maior que 40</td>
                    <td>Obesidade Grave</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
