<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 11 - Classes e Objetos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- FUNÇÃO 1 -->
        <section class="card">
            <h1>Função 1</h1>
            <h2>Retângulo - Cálculo da Área</h2>

            <input type="number" id="base" placeholder="Digite a base">
            <input type="number" id="altura" placeholder="Digite a altura">

            <button onclick="calcularArea()">Calcular Área</button>

            <div id="resultadoArea" class="resultado"></div>
        </section>

        <!-- FUNÇÃO 2 -->
        <section class="card">
            <h1>Função 2</h1>
            <h2>Conta Corrente e Poupança</h2>

            <button onclick="mostrarContas()">Mostrar Dados das Contas</button>

            <div id="resultadoContas" class="resultado"></div>
        </section>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>
</html>
